name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
      # Before the custom domain is live, Pages serves the site from /<repo>/; rewrite root-relative URLs for that.
      - name: Adjust links for the Pages base path
        run: node scripts/rebase-for-subpath.mjs "${{ steps.pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing / IndexNow-enabled engines (which also feed Copilot and other AI search) about updated URLs.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow
        continue-on-error: true  # e.g. before the custom domain DNS is live
        env:
          KEY: 331c1a76e801bbf842f27c7ab8b46845
          HOST: kaizenai.systems
        run: |
          sleep 30
          URLS=$(curl -fsSL "https://$HOST/sitemap-0.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<\/\?loc>//g' | jq -R . | jq -s .)
          jq -n --arg host "$HOST" --arg key "$KEY" --argjson urls "$URLS" \
            '{host: $host, key: $key, keyLocation: ("https://" + $host + "/" + $key + ".txt"), urlList: $urls}' > body.json
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @body.json || true
